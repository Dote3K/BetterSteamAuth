# Release notes from Conventional Commits, for the commits since the previous tag.

[changelog]
header = ""
body = """
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}{% if commit.breaking %} (breaking){% endif %}
{%- endfor %}
{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
tag_pattern = "v[0-9].*"
commit_parsers = [
  { message = "^feat", group = "<!-- 0 -->New" },
  { message = "^fix", group = "<!-- 1 -->Fixed" },
  { message = "^perf", group = "<!-- 2 -->Faster" },
  # Dependabot titles: "build: Bump X from 1 to 2" (NuGet groups) or "build(deps): bump X".
  { message = '^build(\(deps\))?: [Bb]ump', group = "<!-- 3 -->Dependencies" },
  { message = "^(refactor|test|docs|build|ci|chore|style)", skip = true },
]
