# Dependency updates open pull requests; none merges on its own.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    # Daily so a SteamKit2 release (Steam changed something) shows up the next day.
    schedule:
      interval: daily
      time: "06:00"
    # Everything except SteamKit2 waits a week after release: fewer pull requests,
    # and a hijacked release is usually pulled before then.
    cooldown:
      default-days: 7
      exclude:
        - SteamKit2
    open-pull-requests-limit: 10
    labels: [dependencies]
    commit-message:
      prefix: build
      include: scope
    groups:
      # Moves with Avalonia's major version.
      avalonia:
        patterns: [Avalonia*, AvaloniaUI.*, Semi.Avalonia, Irihi.Ursa*]
      # The package and the vpk tool must change together (build/Check-VelopackVersions.ps1).
      velopack:
        patterns: [Velopack, vpk]
      tests:
        patterns: [xunit*, Microsoft.NET.Test.Sdk, coverlet*]
      # SteamKit2 is not in any group: it always gets its own pull request.
      minor-and-patch:
        patterns: ["*"]
        exclude-patterns: [SteamKit2]
        update-types: [minor, patch]

  - package-ecosystem: dotnet-sdk
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: build

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    labels: [dependencies]
    commit-message:
      prefix: ci
    groups:
      actions:
        patterns: ["*"]
