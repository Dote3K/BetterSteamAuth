# A v* tag on main builds a DRAFT release: Setup.exe, a portable zip, Velopack's
# update packages, and SHA256SUMS. SHA256SUMS is signed offline, outside CI, and
# only then is the release published.
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    # Runs only after a required reviewer approves the release environment.
    environment: release
    permissions:
      contents: write
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Read version from the tag
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ($env:TAG -notmatch '^v(\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?)$') { throw "Tag '$env:TAG' isn't vMAJOR.MINOR.PATCH[-pre]." }
          $version = $Matches[1]
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw "Tag '$env:TAG' isn't on main." }
          "version=$version" >> $env:GITHUB_OUTPUT
          "prerelease=$([bool]$Matches[2])".ToLower() >> $env:GITHUB_OUTPUT

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Check vpk and Velopack versions match
        run: ./build/Check-VelopackVersions.ps1

      - name: Restore (locked)
        run: |
          dotnet restore --locked-mode
          dotnet tool restore

      - name: Test
        run: dotnet test -c Release --no-restore

      - name: Publish
        run: dotnet publish src/BetterSteamAuth.App -c Release -r win-x64 --self-contained -p:RestoreLockedMode=true -o publish

      - name: Release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: RELEASE_NOTES.md

      - name: Download the previous release (for delta packages)
        env:
          PRE: ${{ steps.version.outputs.prerelease }}
        run: |
          $pre = if ($env:PRE -eq 'true') { @('--pre') } else { @() }
          dotnet vpk download github --repoUrl "https://github.com/${{ github.repository }}" -o Releases @pre

      - name: Pack
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: >
          dotnet vpk pack -u BetterSteamAuth -v $env:VERSION -p publish -e BetterSteamAuth.exe
          --packTitle BetterSteamAuth --packAuthors BetterSteamAuth
          --releaseNotes RELEASE_NOTES.md -o Releases

      - name: Upload draft release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ github.ref_name }}
          PRE: ${{ steps.version.outputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          $pre = if ($env:PRE -eq 'true') { @('--pre') } else { @() }
          dotnet vpk upload github --repoUrl "https://github.com/${{ github.repository }}" -o Releases `
            --token $env:GH_TOKEN --tag $env:TAG --releaseName "BetterSteamAuth $env:VERSION" --publish false @pre

          # SHA256SUMS lists every asset of the draft; it is signed offline, outside CI.
          $assets = gh release view $env:TAG --json assets --jq '.assets[].name'
          $lines = foreach ($name in ($assets | Sort-Object)) {
            $file = Join-Path Releases $name
            if (-not (Test-Path $file)) { throw "Asset $name isn't in Releases/." }
            "{0}  {1}" -f (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant(), $name
          }
          [IO.File]::WriteAllText("$PWD/SHA256SUMS", ($lines -join "`n") + "`n")
          gh release upload $env:TAG SHA256SUMS
          Get-Content SHA256SUMS
